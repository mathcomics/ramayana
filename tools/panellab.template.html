<title>Panel Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
/* Layout: the panels shown (a chapter, or every panel using a name) as
   they scroll on a phone, beside the selected panel's JSON, beside the
   names. Wide: three columns. Medium: names below the editor. Narrow:
   phone on top, editor and names below. */
:root {
  --bg: #eef0ee; --panel: #ffffff; --fg: #1d2420; --muted: #66706a; --line: #d6dbd7;
  --accent: #8e3b1c; --accent-fg: #ffffff; --warn: #9a5b00; --ok: #2f6b3f;
  --font-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141816; --panel: #1d2320; --fg: #e6ebe7; --muted: #9aa49e; --line: #2f3833;
    --accent: #d9774f; --accent-fg: #1a0f0a; --warn: #e0a24a; --ok: #7cc28e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141816; --panel: #1d2320; --fg: #e6ebe7; --muted: #9aa49e; --line: #2f3833;
  --accent: #d9774f; --accent-fg: #1a0f0a; --warn: #e0a24a; --ok: #7cc28e; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font-body);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
}
.wrap { max-width: 1480px; margin: 0 auto; display: grid; gap: 12px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
h1 { font-family: var(--font-display); font-size: 1.15rem; margin: 0; letter-spacing: -0.01em; }
select, button, textarea { font: inherit; color: var(--fg); }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; min-width: 0; }
.panels button {
  border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 5px 9px; cursor: pointer;
  font-family: var(--font-mono); font-size: 12px;
}
.panels button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.draft-dot { color: var(--warn); }
.main { display: grid; grid-template-columns: minmax(0, 390px) minmax(0, 1fr); gap: 16px; align-items: start; }
.main > .phone { grid-row: span 2; }
.names { grid-column: 2; }
@media (min-width: 1200px) {
  .main { grid-template-columns: minmax(0, 390px) minmax(0, 1fr) minmax(260px, 380px); }
  .main > .phone { grid-row: auto; }
  #section { display: none; }            /* the chapters are in the names column beside */
  .names { grid-column: 3; position: sticky; top: 8px; max-height: calc(100vh - 80px); overflow-y: auto; overscroll-behavior: contain; }
}
@media (max-width: 760px) { .main { grid-template-columns: minmax(0, 1fr); } .main > .phone { grid-row: auto; } .names { grid-column: auto; } }
.phone {
  background: #fffdf8; border-radius: 18px; padding: 10px; border: 1px solid var(--line);
  position: sticky; top: 8px; max-width: 390px; width: 100%; margin: 0 auto;
}
.phone { max-height: calc(100vh - 80px); overflow-y: auto; overscroll-behavior: contain; }
.phone svg { display: block; width: 100%; height: auto; margin-bottom: 6px; cursor: pointer; outline-offset: 2px; }
.phone svg.sel { outline: 3px solid var(--accent); }
@media (max-width: 760px) { .phone { position: static; max-height: 70vh; } }
.side { display: grid; gap: 10px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; min-width: 0; }
.card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0; font-weight: 600; }
.panels { display: flex; flex-wrap: wrap; gap: 6px; }
.scene { color: var(--muted); font-size: 13px; }
textarea {
  width: 100%; min-height: 340px; resize: vertical; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); padding: 8px; font: 12.5px/1.45 var(--font-mono); tab-size: 2;
}
textarea[aria-invalid="true"] { border-color: var(--warn); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { padding: 7px 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); border-radius: 5px; cursor: pointer; font-weight: 500; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn:disabled { opacity: 0.5; cursor: default; }
.status { font-size: 12.5px; color: var(--muted); min-height: 1.2em; }
ul.issues { margin: 0; padding-left: 18px; font-size: 12.5px; }
ul.issues li.warn { color: var(--warn); }
ul.issues li.need { color: var(--muted); }
ul.issues li.ok { color: var(--ok); list-style: none; margin-left: -18px; }
details { font-size: 12.5px; }
details summary { cursor: pointer; color: var(--muted); }
.ref { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6; color: var(--fg); overflow-wrap: anywhere; }
.ref b { font-family: var(--font-body); font-weight: 600; color: var(--muted); }
.phone .cap { font: 600 11px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: 0.06em; color: #66706a; margin: 10px 2px 6px; }
.phone .cap:first-child { margin-top: 2px; }
#names { display: grid; gap: 10px; }
.names .group { display: grid; gap: 5px; }
.names .group h3 { margin: 0; font: 600 12px/1.3 var(--font-body); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips button {
  border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 2px 6px; cursor: pointer;
  font: 11.5px/1.4 var(--font-mono); color: var(--fg);
}
.chips button.wide { font-family: var(--font-body); font-size: 12px; }
.chips button .n { color: var(--muted); margin-left: 4px; }
.chips button.unused { color: var(--muted); border-style: dashed; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chips button[aria-pressed="true"] .n { color: inherit; }
</style>

<div class="wrap">
  <header>
    <h1>Panel Lab</h1>
    <select id="section" aria-label="Section"></select>
  </header>
  <div class="main">
    <div class="phone" id="phone" aria-label="Section preview, scrolls like the phone"></div>
    <div class="side">
      <div class="card">
        <h2>Panels</h2>
        <div class="panels" id="panels" role="group" aria-label="Panels"></div>
        <div class="scene" id="scene"></div>
      </div>
      <div class="card">
        <h2>Panel definition</h2>
        <textarea id="json" spellcheck="false" aria-label="Panel JSON"></textarea>
        <div class="row">
          <button class="btn" id="saveBtn" disabled>Save draft</button>
          <button class="btn ghost" id="revertBtn">Revert to repo</button>
          <button class="btn ghost" id="copyBtn">Copy JSON</button>
          <button class="btn ghost" id="insertBtn" title="A copy of this panel, placed right after it">Insert after</button>
        </div>
        <div class="status" id="status" role="status"></div>
        <ul class="issues" id="issues"></ul>
      </div>
    </div>
    <div class="card names">
      <h2>Names you can use</h2>
      <div class="status">Tap a chapter for its panels, or a name for every panel that uses it (count shown; dashed = unused).</div>
      <div id="names"></div>
      <details>
        <summary>Other fields</summary>
        <div class="ref" id="ref"></div>
      </details>
    </div>
  </div>
</div>

<script>
/*__RENDERER__*/
const ASSETS = /*__ASSETS__*/;
const SECTIONS = /*__SECTIONS__*/;
</script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const slug = (id) => String(id).replace(/[^\w-]/g, '-');
  // added: panels inserted here and not saved yet (id -> section name)
  // view: null shows the chapter state.section; { group, name } shows every
  // panel, in any chapter, that uses that name.
  const state = { section: 0, view: null, panelId: null, edits: {}, drafts: {}, added: {}, bad: false };
  let db = null;
  try {
    const v = JSON.parse(localStorage.getItem('panellab') || '{}');
    state.section = v.section || 0; state.panelId = v.panelId || null;
    if (v.view && v.view.group && v.view.name) state.view = { group: v.view.group, name: v.view.name };
  } catch (e) {}
  const remember = () => { try { localStorage.setItem('panellab', JSON.stringify({ section: state.section, panelId: state.panelId, view: state.view })); } catch (e) {} };
  const byNum = (a, b) => String(a.id).localeCompare(String(b.id), 'en', { numeric: true });

  // A section's panels: repo panels, replaced by saved drafts, plus
  // draft-only panels, plus panels inserted and not saved yet; unsaved
  // edits on top. Each item: { id, def, si } (si: the section's index).
  function sectionPanels(si) {
    const sec = SECTIONS[si];
    const list = sec.panels.map((p) => ({ id: p.id, def: state.drafts[p.id]?.panel || p.def }));
    for (const [id, d] of Object.entries(state.drafts)) if (d.section === sec.name && !sec.panels.some((p) => p.id === id)) list.push({ id, def: d.panel });
    for (const [id, name] of Object.entries(state.added)) if (name === sec.name && !list.some((p) => p.id === id)) list.push({ id, def: state.edits[id] });
    return list.filter((p) => p.def).map((p) => ({ id: p.id, def: state.edits[p.id] || p.def, si })).sort(byNum);
  }
  const allPanels = () => SECTIONS.flatMap((_, si) => sectionPanels(si));

  // The names a panel uses, as "group:name": a plain search of every string
  // in its JSON for a known name; a pose also counts as its base and gesture.
  const NAMES = {
    character: new Set(ASSETS.characters.characters.map((c) => c.id)),
    prop: new Set(Object.keys(ASSETS.props.props)),
    ground: new Set(Object.keys(ASSETS.grounds.grounds)),
  };
  function usesOf(def) {
    const out = new Set();
    const walk = (v, key) => {
      if (Array.isArray(v)) v.forEach((x) => walk(x, key));
      else if (v && typeof v === 'object') for (const [k, x] of Object.entries(v)) walk(x, k);
      else if (typeof v === 'string') {
        if (key === 'pose') {
          out.add('pose:' + v);
          const i = v.indexOf('-');
          if (i > 0) { out.add('base:' + v.slice(0, i)); out.add('gesture:' + v.slice(i + 1)); }
          return;
        }
        const s = v.split('#')[0];
        for (const [g, set] of Object.entries(NAMES)) if (set.has(s)) out.add(g + ':' + s);
      }
    };
    walk(def);
    return out;
  }

  // The panels shown: the chapter, or every panel using the chosen name
  // (the selected panel stays while its edit drops the name).
  function shownList() {
    if (!state.view) return sectionPanels(state.section);
    const key = state.view.group + ':' + state.view.name;
    return allPanels().filter((p) => p.id === state.panelId || usesOf(p.def).has(key));
  }

  // The id for a panel inserted after `x`: it must sort between x and the
  // panel after it, so nothing is renumbered (docs/design/panels.md, Ids).
  // After the last panel the next number (05.22 -> 05.23); otherwise a
  // letter: 05.01 -> 05.01a, 05.01a -> 05.01b, and 05.01aa between
  // 05.01a and 05.01b. Null when nothing fits (05.01 directly before
  // 05.01a): insert after the other panel, or renumber the chapter.
  function idAfter(list, x) {
    const i = list.findIndex((p) => p.id === x), next = list[i + 1]?.id;
    const taken = new Set([...list.map((p) => p.id), ...Object.keys(state.drafts), ...SECTIONS.flatMap((s) => s.panels.map((p) => p.id))]);
    const cmp = (a, b) => String(a).localeCompare(String(b), 'en', { numeric: true });
    const cands = [];
    const m = x.match(/^(\d+)\.(\d+)$/);
    if (!next && m) cands.push(m[1] + '.' + String(Number(m[2]) + 1).padStart(m[2].length, '0'));
    if (/[a-y]$/.test(x)) cands.push(x.slice(0, -1) + String.fromCharCode(x.charCodeAt(x.length - 1) + 1));
    cands.push(x + 'a');
    return cands.find((c) => !taken.has(c) && cmp(x, c) < 0 && (!next || cmp(c, next) < 0)) || null;
  }
  const shown = (id) => shownList().find((p) => p.id === id);

  function draw(scroll) {
    let list = shownList();
    if (!list.some((p) => p.id === state.panelId)) { state.panelId = list[0]?.id; list = shownList(); }
    // phone: the chapter, or the panels using a name, as they scroll
    // (a chapter caption wherever the chapter changes)
    const phone = $('phone'), top = phone.scrollTop;
    let issuesOfSel = [], lastSi = -1;
    phone.innerHTML = list.map(({ id, def, si }) => {
      const r = renderPanel(def, ASSETS, { id, background: SECTIONS[si].backgrounds[id] || '' });
      if (id === state.panelId) issuesOfSel = r.issues;
      const cap = state.view && si !== lastSi ? `<div class="cap">${SECTIONS[si].title}</div>` : '';
      lastSi = si;
      return cap + (id === state.panelId ? r.svg.replace('<svg ', '<svg class="sel" ') : r.svg);
    }).join('') || (state.view ? `<div class="cap">No panel uses ${state.view.name}.</div>` : '');
    phone.scrollTop = top;
    if (scroll) phone.querySelector('svg.sel')?.scrollIntoView({ block: 'nearest' });
    // panel buttons
    $('panels').innerHTML = '';
    list.forEach(({ id, def }) => {
      const b = document.createElement('button');
      const flag = state.edits[id] ? ' *' : state.drafts[id] ? ' •' : '';
      b.innerHTML = id + `<span class="draft-dot">${flag}</span>`;
      b.title = (state.edits[id] ? 'unsaved changes · ' : state.drafts[id] ? 'saved draft · ' : '') + 'tall ' + (def.tall ?? 1.5);
      b.setAttribute('aria-pressed', String(id === state.panelId));
      b.addEventListener('click', () => select(id));
      $('panels').appendChild(b);
    });
    const p = shown(state.panelId);
    $('scene').textContent = (state.view && p ? SECTIONS[p.si].title + ' · ' : '') + (p?.def.scene || '');
    drawSelect();
    drawNames();
    if (document.activeElement !== $('json')) $('json').value = p ? JSON.stringify(p.def, null, 2) : '';
    $('json').setAttribute('aria-invalid', String(state.bad));
    const ul = $('issues'); ul.innerHTML = '';
    const add = (t, cls) => { const li = document.createElement('li'); li.className = cls; li.textContent = t; ul.appendChild(li); };
    if (state.bad) add('JSON doesn’t parse yet; the preview shows the last valid version.', 'warn');
    issuesOfSel.forEach((m) => add(m, /placeholder/.test(m) ? 'need' : 'warn'));
    (p?.def.needs || []).forEach((n) => add('needs ' + n, 'need'));
    if (!state.bad && !issuesOfSel.length && !(p?.def.needs || []).length) add('No issues.', 'ok');
    updateButtons();
  }
  function select(id) { state.panelId = id; state.bad = false; remember(); draw(true); }

  function updateButtons() {
    const id = state.panelId;
    $('saveBtn').disabled = !db || !state.edits[id] || state.bad;
    $('revertBtn').disabled = !state.edits[id] && !state.drafts[id];
    $('revertBtn').textContent = state.added[id] && !state.drafts[id] ? 'Discard new panel'
      : state.drafts[id] && !state.edits[id] ? 'Delete draft' : 'Revert to repo';
    $('insertBtn').disabled = !id || state.bad;
  }

  $('insertBtn').addEventListener('click', () => {
    const from = state.panelId, p = shown(from);
    if (!p) return;
    const id = idAfter(sectionPanels(p.si), from);
    if (!id) { setStatus(`No id fits right after ${from}. Insert after the panel that follows it, or ask Claude to renumber the chapter.`); return; }
    state.added[id] = SECTIONS[p.si].name;
    state.edits[id] = JSON.parse(JSON.stringify(p.def));
    select(id);
    setStatus(`New panel ${id}, a copy of ${from}. Edit it, then Save draft to keep it.`);
  });

  $('json').addEventListener('input', () => {
    try {
      const p = JSON.parse($('json').value);
      if (!p || typeof p !== 'object' || Array.isArray(p)) throw new Error('not an object');
      delete p.id;                        // the id is the file name, not part of the JSON
      state.edits[state.panelId] = p; state.bad = false;
      setStatus('Unsaved changes to ' + state.panelId + '.');
    } catch (e) { state.bad = true; }
    draw();
  });

  $('phone').addEventListener('click', (e) => {
    const el = e.target.closest('[data-panel]');
    if (el && el.dataset.panel !== state.panelId) select(el.dataset.panel);
  });

  state.section = Math.min(state.section, SECTIONS.length - 1);
  // The chapter menu, only on narrower screens (on a phone the names are
  // far below; wide, the chapters are in the names column beside);
  // while a name is chosen it carries one more entry naming it.
  function drawSelect() {
    const opts = SECTIONS.map((s, i) => `<option value="${i}">${s.title}</option>`);
    if (state.view) opts.unshift(`<option value="name">Panels using ${state.view.name} (${state.view.group})</option>`);
    const html = opts.join('');
    if ($('section').dataset.html !== html) { $('section').innerHTML = html; $('section').dataset.html = html; }
    $('section').value = state.view ? 'name' : String(state.section);
  }
  function showChapter(si) { state.view = null; state.section = si; state.panelId = null; remember(); $('phone').scrollTop = 0; draw(); }
  function showName(group, name) {
    state.view = { group, name };
    const key = group + ':' + name, cur = shown(state.panelId);
    if (!cur || !usesOf(cur.def).has(key)) state.panelId = null;
    remember(); $('phone').scrollTop = 0; draw(true);
  }
  $('section').addEventListener('change', () => { if ($('section').value !== 'name') showChapter(Number($('section').value)); });

  // Names column: chapters first, then every name a panel may use, each
  // with the number of panels using it; tap to show those panels.
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  function drawNames() {
    const all = allPanels(), count = {};
    all.forEach((p) => usesOf(p.def).forEach((k) => { count[k] = (count[k] || 0) + 1; }));
    const usedOf = (g) => Object.keys(count).filter((k) => k.startsWith(g + ':')).map((k) => k.slice(g.length + 1));
    const chip = (g, n) => {
      const c = count[g + ':' + n] || 0, on = state.view?.group === g && state.view?.name === n;
      return `<button data-group="${g}" data-name="${esc(n)}" class="${c ? '' : 'unused'}" aria-pressed="${on}">${esc(n)}<span class="n">${c}</span></button>`;
    };
    const sorted = (xs) => [...new Set(xs)].sort((a, b) => a.localeCompare(b));
    const groups = [
      ['character', ASSETS.characters.characters.map((c) => c.id)],
      ['pose', sorted(usedOf('pose')), 'any <base>-<gesture>; these are the ones panels use'],
      ['base', sorted(Object.keys(ASSETS.poseParts.bases))],
      ['gesture', sorted(Object.keys(ASSETS.poseParts.gestures))],
      ['prop', sorted(Object.keys(ASSETS.props.props))],
      ['ground', sorted(Object.keys(ASSETS.grounds.grounds))],
    ];
    const chapters = SECTIONS.map((s, i) => {
      const n = all.filter((p) => p.si === i).length;
      return `<button class="wide" data-chapter="${i}" aria-pressed="${!state.view && state.section === i}">${esc(s.title)}<span class="n">${n}</span></button>`;
    }).join('');
    const html = `<div class="group"><h3>Chapters</h3><div class="chips">${chapters}</div></div>` +
      groups.map(([g, names, note]) => `<div class="group"><h3>${g}${note ? ` <span style="font-weight:400">· ${esc(note)}</span>` : ''}</h3><div class="chips">${names.map((n) => chip(g, n)).join('')}</div></div>`).join('');
    if ($('names').dataset.html !== html) { $('names').innerHTML = html; $('names').dataset.html = html; }
  }
  $('names').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.chapter !== undefined) showChapter(Number(b.dataset.chapter));
    else showName(b.dataset.group, b.dataset.name);
  });

  function setStatus(t) { $('status').textContent = t; }

  $('copyBtn').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('json').value); setStatus('Copied.'); }
    catch (e) { $('json').select(); setStatus('Select and copy the text above.'); }
  });

  $('revertBtn').addEventListener('click', async () => {
    const id = state.panelId;
    if (state.added[id] && !state.drafts[id]) { delete state.added[id]; delete state.edits[id]; state.bad = false; setStatus(`New panel ${id} discarded.`); draw(); return; }
    if (state.edits[id]) { delete state.edits[id]; state.bad = false; setStatus('Unsaved changes dropped.'); draw(); return; }
    if (state.drafts[id] && db) {
      $('revertBtn').disabled = true;
      try { await db.collection('panels').doc(slug(id)).delete(); setStatus('Draft deleted; showing the repo version.'); }
      catch (e) { setStatus('Couldn’t delete the draft (' + (e?.code || 'error') + ').'); updateButtons(); }
    }
  });

  $('saveBtn').addEventListener('click', async () => {
    const id = state.panelId, panel = state.edits[id], p = shown(id);
    if (!db || !panel || !p) return;
    $('saveBtn').disabled = true;
    try {
      await db.collection('panels').doc(slug(id)).set({ id, panel, section: SECTIONS[p.si].name, savedAt: new Date().toISOString() });
      delete state.edits[id];
      setStatus(`Saved draft of ${id}. Ask Claude to merge drafts into the repo.`);
    } catch (e) {
      setStatus(e?.code === 'permission_denied' ? 'You can view this page but not save to it. Use Copy JSON instead.'
        : 'Couldn’t save (' + (e?.code || 'error') + '). Try again in a moment.');
    }
    draw();
  });

  // Reference: the other fields a panel may use.
  $('ref').innerHTML = `<b>tall</b> height ÷ width: 1.5 (default), 1, 0.6<br><b>at</b> 0–1 across the width, or ${Object.keys(SLOTS).join(', ')}, or {"before"|"behind"|"beside"|"left-of"|"right-of": name, "gap": h}<br><b>order</b> one figures list of figures ("character"), props ("prop") and foregrounds ("foreground"), drawn in order (last is in front)<br><b>foreground</b> {"foreground": [left, right] heights (shares of the height), "color": ground name}: a band of ground; stand on it with "on": "foreground" plus "at"<br>` +
    `<b>row</b> top, horizon, back, mid, front (default), floor, closeup, or a number: the bottom edge as a share of the height (0 bottom, 1 top)<br><b>figure</b> facing, mouth, turn (head, degrees, + to its right), hands {right, left}, adjust {"right.arm.shoulder": 40}, scale, nudge (head-units: a number across, or [dx, dy], + up), on (a prop's anchor, a foreground, or a figure's #hands, #hand-right, #hand-left, #head, #shoulder: what it carries)<br><b>panel</b> tall, horizon, sky, ground, mode "negative" (black ground, white silhouettes), needs [..]`;

  draw(true);

  // Saved drafts (db collection "panels").
  setStatus('Connecting to saved drafts…');
  (async () => {
    db = window.claude?.use ? await window.claude.use('db') : null;
    if (!db) { setStatus('Drafts can’t be saved in this view. Use Copy JSON instead.'); updateButtons(); return; }
    const timer = setTimeout(() => setStatus('Saved drafts can’t be reached yet. They’ll appear when the connection returns.'), 10000);
    db.collection('panels').onSnapshot((snap) => {
      clearTimeout(timer);
      state.drafts = {};
      snap.docs.map((d) => d.data()).filter((d) => d && d.id && d.panel).forEach((d) => { state.drafts[d.id] = d; });
      if (/^Connecting/.test($('status').textContent)) setStatus(Object.keys(state.drafts).length ? `${Object.keys(state.drafts).length} saved draft(s) shown (•).` : '');
      draw();
    }, (e) => { clearTimeout(timer); setStatus('Saved drafts stopped updating (' + (e?.code || 'error') + '). Reload to reconnect.'); });
  })();
})();
</script>
