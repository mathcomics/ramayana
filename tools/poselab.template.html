<title>Warli Pose Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
/* Layout: a sticky stage (large figure + true phone-size figure) over a
   scrolling column of joint sliders grouped by body part. */
:root {
  --bg: #eef0ee;
  --panel: #ffffff;
  --fg: #1d2420;
  --muted: #66706a;
  --line: #d6dbd7;
  --accent: #8e3b1c;     /* geru */
  --accent-fg: #ffffff;
  --track: #cfd5d1;
  --font-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141816; --panel: #1d2320; --fg: #e6ebe7; --muted: #9aa49e;
    --line: #2f3833; --accent: #d9774f; --accent-fg: #1a0f0a; --track: #3a443e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141816; --panel: #1d2320; --fg: #e6ebe7; --muted: #9aa49e;
  --line: #2f3833; --accent: #d9774f; --accent-fg: #1a0f0a; --track: #3a443e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 14px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }

.stage {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 10px 8px;
  display: grid; gap: 8px;
}
.stage-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-size: 1.15rem; margin: 0; letter-spacing: -0.01em; }
.stage-head .meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.canvas {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px;
  height: min(40vh, 330px);
}
.paper { border-radius: 6px; overflow: hidden; position: relative; min-width: 0; }
.paper svg { display: block; width: 100%; height: 100%; }
.actual { width: 112px; display: grid; grid-template-rows: 1fr auto; }
.actual .paper { height: 100%; }
.cap { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; text-align: center; padding-top: 4px; }

.bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
select, input[type="text"] {
  font: inherit; color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; min-width: 0;
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; background: var(--panel); }
.seg button {
  font: inherit; font-size: 12.5px; border: 0; background: transparent; color: var(--fg);
  padding: 6px 10px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.swatches { display: inline-flex; gap: 6px; }
.sw {
  width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line);
  cursor: pointer; padding: 0;
}
.sw[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--bg) inset; }

.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
fieldset {
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  padding: 10px 12px 12px; margin: 0; min-width: 0; display: grid; gap: 6px;
}
legend { font-weight: 600; font-size: 13px; padding: 0 4px; }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 46px; align-items: center; gap: 8px; }
.row label { font-size: 12.5px; color: var(--muted); }
.row output { font-family: var(--font-mono); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }

.save { display: grid; gap: 10px; }
.save .bar { align-items: end; }
.btn {
  font: inherit; font-weight: 600; font-size: 13px; border-radius: 5px; cursor: pointer;
  padding: 7px 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg);
}
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { font-size: 12.5px; color: var(--muted); min-height: 1.2em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel);
  color: var(--fg); border-radius: 999px; padding: 4px 10px; cursor: pointer;
}
.chip.saved { border-color: var(--accent); }
.hint { font-size: 12.5px; color: var(--muted); max-width: 65ch; margin: 0; }
pre {
  font-family: var(--font-mono); font-size: 11.5px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 10px; overflow-x: auto; margin: 0; max-height: 220px;
}
@media (max-width: 420px) {
  .actual { width: 92px; }
  .row { grid-template-columns: 58px minmax(0, 1fr) 40px; }
}
</style>

<div class="wrap">
  <section class="stage" aria-label="Preview">
    <div class="stage-head">
      <h1>Pose Lab</h1>
      <span class="meta" id="meta">monkey · side</span>
    </div>
    <div class="canvas">
      <div class="paper" id="big"></div>
      <div class="actual">
        <div class="paper" id="small"></div>
        <div class="cap">phone size</div>
      </div>
    </div>
  </section>

  <div class="bar">
    <label class="field"><span>Start from</span>
      <select id="preset"></select>
    </label>
    <div class="field"><span>Body</span><div class="seg" id="view"></div></div>
    <div class="field"><span>Head</span><div class="seg" id="headView"></div></div>
    <div class="field"><span>Mouth</span><div class="seg" id="mouth"></div></div>
    <div class="field"><span>Facing</span><div class="seg" id="facing"></div></div>
  </div>

  <div class="bar">
    <div class="field"><span>Ground</span><div class="swatches" id="ground"></div></div>
    <div class="field"><span>Body colour</span><div class="swatches" id="bodyc"></div></div>
    <div class="field"><span>Loincloth</span><div class="swatches" id="clothc"></div></div>
  </div>

  <div class="groups" id="groups"></div>

  <section class="save" aria-label="Save">
    <div class="bar">
      <label class="field" style="flex:1 1 180px"><span>Pose name</span>
        <input type="text" id="name" autocomplete="off" spellcheck="false">
      </label>
      <button class="btn" id="saveBtn" type="button">Save pose</button>
      <button class="btn ghost" id="copyBtn" type="button">Copy JSON</button>
    </div>
    <div class="status" id="status" role="status"></div>
    <div class="field"><span>Your saved poses</span><div class="chips" id="saved"></div></div>
    <p class="hint">Saving with an existing name replaces that pose. Saved poses are kept with this page, so Claude can read them and add them to the repo.</p>
    <pre id="json" aria-label="Pose JSON"></pre>
  </section>
</div>

<script>
/*__RENDERER__*/
const SPECIES = /*__SPECIES__*/;
const STARTERS = /*__POSES__*/;
</script>
<script>
(() => {
  const GROUNDS = [['paper', '#f2ece1'], ['blue', '#3fb4dc'], ['pink', '#d9857e'], ['geru', '#7b2f1b']];
  const BODIES = [['brown', '#5a2a12'], ['dark red', '#7c1d1d'], ['black', '#141210'], ['white', '#f3f1ec'], ['gold', '#c79a2c'], ['tan', '#c08d6a']];
  const CLOTHS = [['orange', '#e0541a'], ['yellow', '#f0d23a'], ['green', '#2fb39a'], ['red', '#d42a2a'], ['purple', '#8a5cd6']];

  const SLIDERS = [
    { key: 'spine', title: 'Body', rows: [
      ['spine.lean', 'lean', -60, 180], ['spine.chest', 'chest', -60, 60],
      ['spine.neck', 'neck', -60, 60], ['spine.head', 'head', -45, 45]] },
    { key: 'near', title: 'Near arm & leg', rows: [
      ['near.arm.shoulder', 'shoulder', -90, 230], ['near.arm.elbow', 'elbow', 0, 160], ['near.arm.wrist', 'wrist', -90, 90],
      ['near.leg.hip', 'hip', -90, 150], ['near.leg.knee', 'knee', 0, 160], ['near.leg.ankle', 'ankle', -60, 60]] },
    { key: 'far', title: 'Far arm & leg', rows: [
      ['far.arm.shoulder', 'shoulder', -90, 230], ['far.arm.elbow', 'elbow', 0, 160], ['far.arm.wrist', 'wrist', -90, 90],
      ['far.leg.hip', 'hip', -90, 150], ['far.leg.knee', 'knee', 0, 160], ['far.leg.ankle', 'ankle', -60, 60]] },
    { key: 'tail', title: 'Tail & air', rows: [
      ['tail.lift', 'tail lift', -90, 120], ['tail.curl', 'tail curl', -60, 300], ['lift', 'height', 0, 3, 0.05]] },
  ];

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const get = (o, path) => path.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
  const set = (o, path, v) => {
    const ks = path.split('.'); let a = o;
    for (let i = 0; i < ks.length - 1; i++) a = a[ks[i]] ??= {};
    a[ks[ks.length - 1]] = v;
  };

  const state = {
    pose: normalizePose(STARTERS[0]),
    facing: 1,
    ground: GROUNDS[0][1], body: BODIES[0][1], cloth: CLOTHS[0][1],
    saved: [],
  };
  const $ = (id) => document.getElementById(id);

  // ---------- render
  function draw() {
    const colors = { body: state.body, cloth: state.cloth };
    if (state.body === '#141210') colors.eye = '#e0541a';
    if (state.body === '#f3f1ec') colors.mouth = '#141210';
    const p = state.pose;
    const big = renderFigure(SPECIES, p, { x: 0, y: 0, scale: 1, facing: state.facing, colors });
    const groundLine = `<line x1="-6" x2="6" y1="0" y2="0" stroke="#000" stroke-opacity="0.18" stroke-width="0.03"/>`;
    $('big').innerHTML = `<svg viewBox="-4.6 -8.3 9.2 9" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Figure preview"><rect x="-20" y="-20" width="40" height="40" fill="${state.ground}"/>${groundLine}${big.svg}</svg>`;
    const small = renderFigure(SPECIES, p, { x: 0, y: 0, scale: 1, facing: state.facing, colors });
    // 20 px per head-unit: the target phone scale
    $('small').innerHTML = `<svg viewBox="-2.8 -8.3 5.6 9" width="112" height="180" style="width:100%;height:100%;max-width:112px" role="img" aria-label="Figure at phone size"><rect x="-20" y="-20" width="40" height="40" fill="${state.ground}"/>${small.svg}</svg>`;
    $('meta').textContent = `monkey · ${p.view} · ${p.name}`;
    $('json').textContent = JSON.stringify(exportPose(), null, 2);
  }

  function exportPose() {
    const p = clone(state.pose);
    const out = { name: $('name').value.trim() || p.name, view: p.view, headView: p.headView, mouth: p.mouth };
    if (p.airborne) { out.airborne = true; out.lift = p.lift; }
    out.spine = p.spine; out.near = p.near; out.far = p.far; out.tail = p.tail;
    return out;
  }

  // ---------- controls
  function seg(id, options, getv, setv) {
    const el = $(id); el.innerHTML = '';
    for (const [label, value] of options) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label;
      b.addEventListener('click', () => { setv(value); syncControls(); draw(); });
      b.dataset.value = JSON.stringify(value);
      el.appendChild(b);
    }
    el._sync = () => { for (const b of el.children) b.setAttribute('aria-pressed', String(b.dataset.value === JSON.stringify(getv()))); };
  }
  function swatches(id, list, keyName) {
    const el = $(id); el.innerHTML = '';
    for (const [label, color] of list) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'sw'; b.style.background = color; b.title = label;
      b.setAttribute('aria-label', label);
      b.addEventListener('click', () => { state[keyName] = color; syncControls(); draw(); });
      b.dataset.value = color; el.appendChild(b);
    }
    el._sync = () => { for (const b of el.children) b.setAttribute('aria-pressed', String(b.dataset.value === state[keyName])); };
  }

  function buildSliders() {
    const host = $('groups'); host.innerHTML = '';
    for (const g of SLIDERS) {
      const fs = document.createElement('fieldset');
      const lg = document.createElement('legend'); lg.textContent = g.title; lg.id = 'lg-' + g.key; fs.appendChild(lg);
      for (const [path, label, min, max, step = 1] of g.rows) {
        const row = document.createElement('div'); row.className = 'row';
        const id = 's-' + path.replace(/\./g, '-');
        row.innerHTML = `<label for="${id}">${label}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}"><output for="${id}"></output>`;
        const input = row.querySelector('input'), out = row.querySelector('output');
        input.addEventListener('input', () => {
          const v = Number(input.value);
          set(state.pose, path, v);
          if (path === 'lift') state.pose.airborne = v > 0;
          out.textContent = step < 1 ? v.toFixed(2) : v + '°';
          draw();
        });
        row._sync = () => {
          const v = get(state.pose, path) ?? 0;
          input.value = v; out.textContent = step < 1 ? Number(v).toFixed(2) : v + '°';
        };
        fs.appendChild(row);
      }
      host.appendChild(fs);
    }
  }

  function syncControls() {
    for (const id of ['view', 'headView', 'mouth', 'facing', 'ground', 'bodyc', 'clothc']) $(id)._sync();
    document.querySelectorAll('.row').forEach((r) => r._sync());
    const front = state.pose.view === 'front';
    $('lg-near').textContent = front ? 'Right arm & leg (as seen)' : 'Near arm & leg';
    $('lg-far').textContent = front ? 'Left arm & leg (as seen)' : 'Far arm & leg';
  }

  function load(p) {
    state.pose = normalizePose(clone(p));
    $('name').value = state.pose.name;
    syncControls(); draw();
  }

  function fillPresets() {
    const sel = $('preset');
    const opts = STARTERS.map((p, i) => `<option value="s:${i}">${p.name}</option>`);
    const saved = state.saved.map((p, i) => `<option value="d:${i}">${p.name} (saved)</option>`);
    const cur = sel.value;
    sel.innerHTML = `<optgroup label="Starter poses">${opts.join('')}</optgroup>` + (saved.length ? `<optgroup label="Saved">${saved.join('')}</optgroup>` : '');
    if (cur) sel.value = cur;
  }
  $('preset').addEventListener('change', (e) => {
    const [k, i] = e.target.value.split(':');
    load(k === 's' ? STARTERS[+i] : state.saved[+i]);
  });

  seg('view', [['Side', 'side'], ['Front', 'front']], () => state.pose.view, (v) => {
    state.pose.view = v; state.pose.headView = v === 'front' ? 'front' : 'side';
  });
  seg('headView', [['Front', 'front'], ['¾', '3q'], ['Side', 'side']], () => state.pose.headView, (v) => { state.pose.headView = v; });
  seg('mouth', [['Open', 'open'], ['Closed', 'closed']], () => state.pose.mouth, (v) => { state.pose.mouth = v; });
  seg('facing', [['→', 1], ['←', -1]], () => state.facing, (v) => { state.facing = v; });
  swatches('ground', GROUNDS, 'ground');
  swatches('bodyc', BODIES, 'body');
  swatches('clothc', CLOTHS, 'cloth');
  buildSliders();
  fillPresets();
  load(STARTERS[0]);

  // ---------- copy
  $('copyBtn').addEventListener('click', async () => {
    const text = $('json').textContent;
    try { await navigator.clipboard.writeText(text); $('status').textContent = 'Copied pose JSON.'; }
    catch {
      const r = document.createRange(); r.selectNodeContents($('json'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      $('status').textContent = 'Selected the JSON below. Copy it with your device’s copy command.';
    }
  });

  // ---------- saved poses (shared store)
  let db = null;
  const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'pose';
  $('saveBtn').disabled = true;
  $('status').textContent = 'Connecting to saved poses…';

  function renderSaved() {
    const host = $('saved'); host.innerHTML = '';
    if (!state.saved.length) { host.innerHTML = '<span class="hint">None yet. Tune a pose, name it, and tap Save pose.</span>'; return; }
    state.saved.forEach((p) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip saved'; b.textContent = p.name;
      b.addEventListener('click', () => load(p));
      host.appendChild(b);
    });
  }
  renderSaved();

  (async () => {
    db = window.claude?.use ? await window.claude.use('db') : null;
    if (!db) {
      $('status').textContent = 'Saving isn’t available here. Use Copy JSON instead.';
      return;
    }
    $('saveBtn').disabled = false;
    $('status').textContent = '';
    let timer = setTimeout(() => { $('status').textContent = 'Saved poses can’t be reached yet. They’ll appear when the connection returns.'; }, 10000);
    db.collection('poses').onSnapshot((snap) => {
      if (!snap.metadata?.fromCache) { clearTimeout(timer); if ($('status').textContent.startsWith('Saved poses can’t')) $('status').textContent = ''; }
      state.saved = snap.docs.map((d) => d.data()).filter((d) => d && d.pose).map((d) => d.pose)
        .sort((a, b) => a.name.localeCompare(b.name));
      renderSaved(); fillPresets();
    }, (e) => {
      clearTimeout(timer);
      $('status').textContent = 'Saved poses stopped updating (' + (e?.code || 'error') + '). Reload the page to reconnect.';
    });
  })();

  $('saveBtn').addEventListener('click', async () => {
    if (!db) return;
    const name = $('name').value.trim();
    if (!name) { $('status').textContent = 'Give the pose a name first.'; $('name').focus(); return; }
    const pose = exportPose(); pose.name = name;
    $('saveBtn').disabled = true;
    try {
      await db.collection('poses').doc(slug(name)).set({ species: 'monkey', pose, savedAt: new Date().toISOString() });
      $('status').textContent = `Saved “${name}”.`;
    } catch (e) {
      $('status').textContent = e?.code === 'permission_denied'
        ? 'You can view this page but not save to it. Use Copy JSON instead.'
        : 'Couldn’t save (' + (e?.code || 'error') + '). Try again in a moment.';
    } finally { $('saveBtn').disabled = false; }
  });
})();
</script>
