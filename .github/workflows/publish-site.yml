name: Publish the reader site

# Asks Cloudflare Pages to build and publish the site from main, by calling
# the project's deploy hook. Cloudflare runs the build itself
# (node tools/build-site.mjs -> _site/), as in the sister project kena, but
# automatic builds on push are turned off, so the site changes only when
# this is run: Actions -> Publish the reader site -> Run workflow.
# Setup: docs/design/panels.md (Publishing). Needs the repo secret
# CLOUDFLARE_DEPLOY_HOOK (the hook's URL).
#
# To switch to automatic builds later: turn automatic production
# deployments back on in Cloudflare and delete this workflow.

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the deploy hook
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Repo secret CLOUDFLARE_DEPLOY_HOOK is not set."
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
          echo
          echo "Build started; follow it in Cloudflare: Workers & Pages -> ramayana -> Deployments."
