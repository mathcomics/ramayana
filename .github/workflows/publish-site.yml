name: Publish the reader site

# Builds the reader site (tools/build-site.mjs -> _site/) and uploads it to
# Cloudflare Pages (project `ramayana`, a Direct Upload project, so Cloudflare
# never builds on push). Run it by hand: Actions -> Publish the reader site ->
# Run workflow. The site is private behind Cloudflare Access; setup steps are
# in docs/design/panels.md (Publishing).
#
# Needs repo secrets CLOUDFLARE_API_TOKEN (Account: Cloudflare Pages: Edit)
# and CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:

concurrency:
  group: publish-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Build
        run: node tools/build-site.mjs

      - name: Create the Pages project if it doesn't exist yet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@3 pages project list | grep -qw ramayana; then
            echo "Project exists."
          else
            npx --yes wrangler@3 pages project create ramayana --production-branch=main
          fi

      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@3 pages deploy _site
          --project-name=ramayana --branch=main
          --commit-hash=${{ github.sha }} --commit-dirty=true
