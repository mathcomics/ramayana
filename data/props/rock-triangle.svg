<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- A triangular rock, a peak: rounded corners, plain stone (#ac9393); scale it
     to the scene (a mountain carried on a palm, 16.13).
     100 px = 1 head-unit; bottom edge on the ground.
     Anchors: hand (where a carrier's hand holds it, the middle of the
     bottom: "on": "hanuman#hand-right" lands it there); stand and seat at
     the peak; stand-left and stand-right halfway up each side —
     "on": "rock-triangle#stand" / "#stand-left" / "#stand-right" / "#seat". -->

<svg
   data-recolor-body="#ac9393"
   viewBox="0 0 182 166"
   width="182"
   height="166"
   version="1.1"
   id="rock-triangle"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <path
     id="rock"
     style="fill:#ac9393;fill-opacity:1;stroke:none"
     d="M 81,9 C 87,1 95,1 101,9 L 176,141 C 184,155 176,165 160,165 H 22 C 6,165 -2,155 6,141 Z" />
  <g
     id="anchors">
    <circle id="stand" cx="91" cy="3" r="6" fill="none" />
    <circle id="seat" cx="91" cy="3" r="6" fill="none" />
    <circle id="stand-left" cx="43.5" cy="75" r="6" fill="none" />
    <circle id="stand-right" cx="138.5" cy="75" r="6" fill="none" />
    <circle id="hand" cx="91" cy="160" r="6" fill="none" />
  </g>
</svg>
