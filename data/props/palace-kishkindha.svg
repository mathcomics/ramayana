<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Kishkindha: the monkey city's palace on its hill, with the Rishyamukha
     mountain in front - the flat-topped rock where Hanuman and the exiles
     watch Sita carried over, and later meet Rama. Rock outlines perturbed
     with seeded randomness (seed 11; the result is the drawing). Palace in
     the palace sepia with rounded stupa domes; stone palette from the
     artist's Lanka layout. 100 px = 1 head-unit; bottom edge on the ground.
     Anchors: stand-left / stand / stand-right on the plateau (feet); use
     "on": "palace-kishkindha#stand" etc. -->

