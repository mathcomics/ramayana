<!-- Broad sword, a variant of the sword (kind "sword-broad";
     tools/import-held.mjs -> data/held.json). A panel swaps it in with
     adjust: "right.arm.prop.kind": "sword-broad". One layer per version:
     "base" for everyone, and a layer named by a character id for that
     character's own. Each layer: the drawing, plus a path labelled "line"
     (not drawn): a straight line from the grip (start, where the hand
     closes) to the tip (end); its length is the sword's length: 100 px =
