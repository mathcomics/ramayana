     character's own bow. Each layer: the drawing, plus (not drawn) a path
     labelled "line", the bow's curve from the top tip (start) to the bottom
     tip (end), and a circle labelled "grip" where the hand holds it. The
     string runs tip to tip (to the drawing hand when drawn); the belly is
     on the side away from the string. Draw at size: 100 px = 1 head-unit
     (base: 5.8 tip to tip). -->

