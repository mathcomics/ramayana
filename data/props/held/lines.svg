<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Reference lines for held props (src/parts.js, tools/import-held.mjs).
     Poses place these lines; the weapon drawings (weapons.svg) are laid along
     them, so a weapon can be redrawn without touching any pose.
     100 px = 1 head-unit. The hand holds the line at the grip.
     sword: a straight line from the grip (start) to the tip (end); also used
       by the club. Its length is the weapon's length beyond the hand.
     bow: a curved line from the top tip (start) to the bottom tip (end),
       with the anchor `grip` where the hand holds it; the belly is on the
       side away from the string (here +x), the string runs tip to tip. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="400" height="400" viewBox="-150 -320 400 640">
  <g inkscape:groupmode="layer" inkscape:label="sword" transform="translate(0 0)">
    <path inkscape:label="line" d="M 0 0 L 0 -210" fill="none" stroke="#d02020" stroke-width="3"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="bow" transform="translate(150 0)">
    <path inkscape:label="line" d="M -64 -290 Q 64 0 -64 290" fill="none" stroke="#d02020" stroke-width="3"/>
    <circle inkscape:label="grip" cx="0" cy="0" r="4" fill="#2060d0"/>
  </g>
</svg>
