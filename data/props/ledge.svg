  <path fill="#ac9393" d="M 8 230 L 3.3 176.5 L 30.5 140.2 L 26.5 89 L 32 44 L 74.4 38.9 L 118.2 47.2 L 157.4 36.4 L 206.2 42.5 L 242.2 39.3 L 286.1 41.9 L 328.9 49.4 L 371.1 47.1 L 413.2 33.4 L 455.5 35.6 L 503 43.6 L 540.1 45.9 L 588 38 L 595.2 87.9 L 604 141.5 L 608.7 188.7 L 612 230 Z"/>
  <path fill="#8d7676" d="M 70 43.4 L 180 43.2 L 205 230 L 110 230 Z"/>
  <path fill="#8d7676" d="M 350 52.3 L 460 40.4 L 500 230 L 410 230 Z"/>
  <g id="anchors">
