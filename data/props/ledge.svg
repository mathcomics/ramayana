<!-- A rocky ledge: flat standing top, craggy sides; for Kishkindha and any
     rocky scene. Outline perturbed with seeded randomness (seed 7; generator
     kept out of the repo, the result is the drawing). Stone palette from the
     artist's Lanka layout. 100 px = 1 head-unit; bottom edge on the ground.
     Anchors: stand-left / stand / stand-right on the top (feet), seat near
     the right edge (hips); use "on": "ledge#stand" etc. -->
