<!-- Lanka: the golden city on its dark mountain island, seen far off across
     the sea. Redrawn 2026-11-07 from the artist's block layout
     (layouts/scenes/0.5-lanka.svg) with a small palace silhouette: central
     dome, two side domes, gate arch, crenellated wall with stone end towers.
     Same palette as the layout (golds d4aa00 / ffd42a, dark 1a1a1a island,
     ac9393 stone); palace.svg-level simplicity, smaller since it sits on the
     mountain. Sized for the horizon row (as drawn in a 0.5 panel).
     100 px = 1 head-unit; the bottom edge sits on the sea line. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2009.34 342.38" width="2009.34" height="342.38">
  <!-- the island: a dark mountain rising from the sea, flat where the city sits -->
  <path fill="#1a1a1a" d="M 0 342.4 L 150 314 L 380 206 L 430 180 L 560 174 L 1000 177 L 1450 174 L 1580 180 L 1680 212 L 1860 300 L 2009.3 336 L 2009.3 342.4 Z"/>
  <!-- palace body behind the wall -->
  <rect fill="#d4aa00" x="840" y="82" width="320" height="100"/>
  <!-- drum under the central dome -->
  <rect fill="#d4aa00" x="932" y="46" width="136" height="40"/>
  <!-- city wall with crenellations -->
  <rect fill="#ffd42a" x="420" y="148" width="1160" height="34"/>
  <path fill="#ffd42a" d="M438 148v-14h36v14z M534 148v-14h36v14z M630 148v-14h36v14z M726 148v-14h36v14z M1238 148v-14h36v14z M1334 148v-14h36v14z M1430 148v-14h36v14z M1526 148v-14h36v14z"/>
  <!-- stone towers at the wall ends -->
  <rect fill="#ac9393" x="414" y="96" width="56" height="86"/>
  <path fill="#ac9393" d="M408 98 L442 62 L476 98 Z"/>
  <rect fill="#ac9393" x="1530" y="96" width="56" height="86"/>
  <path fill="#ac9393" d="M1524 98 L1558 62 L1592 98 Z"/>
  <!-- side domes with finials -->
  <path fill="#d4aa00" d="M852 82 C845 58 874 46 884 36 C894 46 923 58 916 82 Z"/>
  <path fill="#d4aa00" d="M880 40 L884 20 L888 40 Z"/>
  <path fill="#d4aa00" d="M1084 82 C1077 58 1106 46 1116 36 C1126 46 1155 58 1148 82 Z"/>
  <path fill="#d4aa00" d="M1112 40 L1116 20 L1120 40 Z"/>
  <!-- central dome with finial -->
  <path fill="#ffd42a" d="M945 52 C936 28 985 20 1000 12 C1015 20 1064 28 1055 52 Z"/>
  <path fill="#ffd42a" d="M996 15 L1000 0 L1004 15 Z"/>
