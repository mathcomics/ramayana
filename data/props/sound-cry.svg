<!-- A cry heard from far away: a ragged burst with a tail, the artist's drawing.
     100 px = 1 head-unit. Not a ground prop — it is placed with "lift".
     Anchor: face, the burst's centre, where the crier's head goes
     ("on": "sound-cry#face"), drawn to size: its diameter is the head height
     (r="40" = 0.8 of a head-unit, which sits inside the burst with a margin;
     r="50" would be a full-size head). The artist marked the centre with a red dot inside the
     drawing; moved out to the anchors group (where the loader reads it and it
     is not drawn), same point. The drawing is unchanged otherwise. -->

