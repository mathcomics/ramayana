<!-- The sleeping giant's middle, lying along the ground: the yellow dhoti
     on the left, the bare chest rising on the right, one arm across the
     waist with the hand hanging over the lower left. Cut off on the left,
     top and right; bottom edge on the ground. Skin #9a7a7a, cloth #ffcc00
     (recolor: body, cloth). 100 px = 1 head-unit; no anchors. -->

