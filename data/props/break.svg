     "on": "city-side" or "city-side#<anchor>"), so whatever is drawn
     before that prop shows through. Sized like any prop ("scale"), moved
     with "nudge", turned with "rotate". The fill colour only marks the
     shape. 100 px = 1 head-unit. -->

