<!-- A chariot, side on, facing right: the curved car on its wheel, the
     pole running out to the right. The artist's drawing. Usually placed in
     the bottom right corner, cut by the edges. 100 px = 1 head-unit;
     bottom edge on the ground. Anchors: stand and stand-left (feet), set
     low inside the car so the riders show from the waist up;
     "on": "chariot#stand" / "chariot#stand-left". Recolour: "body" is the gold
     (#d4aa00) of the car, pole and wheel rim. -->

