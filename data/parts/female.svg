<!-- female body parts for the drawn-parts renderer (src/parts.js).
     Generated by tools/export-parts.mjs from data/parts.json; edit it here,
     then run tools/import-parts.mjs.

     The figure faces right; front-view limbs are its near side (picture-right).
     Every part is at rotation 0: limbs and hands hang straight down, the
     neck points up, feet are flat. Parts that share a joint sit on the same
     anchor: hands on the wrist, the foot on the ankle, and the bent torsos
     (red dashed, layers front-bend / side-bend: torso, torso-2, ... from
     least to most bent) on the straight one.
     The side view stands to the right with its own parts and anchors
     (side-...); a side anchor sits at the same height as its front partner,
     and one side-hip serves both legs. As the figure turns, each side part
     is blended with its front partner, so it keeps the same number of edges
     in the same order.

     hand: one hand only (the "in" hand), a size guide: the hand shapes are
     shared, in data/parts/hands.svg, and scaled to this hand's size.

     Labels: torso, neck (front only), upper-arm, forearm, hand, thigh,
     shin, foot.
     anchors: shoulder, elbow, wrist, hip, knee, ankle, neck-base, neck-top,
     side-shoulder, side-shoulder-far, side-elbow, side-wrist, side-hip,
     side-knee, side-ankle, side-neck-base; toe, side-toe (tip of each foot; the front foot points its toes at the viewer),
     head, side-head (centre of the head) (the circle centre counts).
     end (DRAFT, not read by the renderer yet): upper-arm, forearm, thigh,
     shin seen end-on (pointing at the viewer), and the foot with its sole
     facing the viewer (heel on the left, toes to the right as in side view), as the hands' end layer.
     Each sits on one anchor where its bone projects to a point:
     end-shoulder, end-elbow, end-hip, end-knee, end-ankle; end-toe (toe tip
     of the sole). Same edge count
     (limbs 4, feet 7) as the
     front / side partners. Inner side = picture-left (toward the body).
     100 px = 1 head-unit; ground at y = 0. -->

