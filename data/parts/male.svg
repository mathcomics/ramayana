<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Male body parts, for the drawn-parts renderer (experiment).
     Layers: front, side, front-bend, side-bend (one torso each), anchors, guide.
     Every part path carries an inkscape:label (torso, neck, upper-arm, forearm,
     hand-fist, hand-out, hand-point, thigh, shin, foot;
     hand-in is optional: without it, hand-out is mirrored). The four torsos must keep the same number of
     nodes and edges, in the same order round the outline, so they can be
     interpolated; the same for the two feet.
     anchors: one small circle per joint, labelled shoulder, elbow, wrist, hip,
     knee, ankle, neck-base, neck-top. They were estimated from how the parts
     overlap; drag them to where each joint should pivot. The circle centre
     is what counts, not its size.
     Units: 100 px = 1 head-unit. The guide layer is ignored. -->

