     hand).

     Layers front, side, end (seen end-on, pointing at the viewer); labels
     hand-fist, hand-out, hand-in, hand-point, each on its own wrist anchor
     (wrist-<hand>, side-wrist-<hand>, end-wrist-<hand>), at rotation 0
     (pointing straight down). A side or end hand has the same number of
     edges as its front partner. Anchors hand-tip, side-hand-tip: the tip
     of the fist (front on wrist-fist, side on side-wrist-fist).
     100 px = 1 head-unit (male size). -->
